name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check src tests
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обучить модель для образа
        run: |
          pip install -r requirements.txt
          PYTHONPATH=src python -m metro.synth --out data/raw
          PYTHONPATH=src python -m metro.train --data data/raw --out models
      - run: docker build -t metro-forecast-api:${{ github.sha }} .
